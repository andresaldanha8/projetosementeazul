<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Excel - 1º Autismo Run</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #00CFFD 0%, #0066CC 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .download-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            margin-bottom: 30px;
        }

        .btn-download {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-download:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-voltar {
            display: inline-block;
            color: #00CFFD;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
        }

        .btn-voltar:hover {
            color: #0066CC;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Template Excel - 1º Autismo Run</h1>
            <p>Baixe o template para importar os dados do CSV</p>
        </div>

        <div class="download-section">
            <button class="btn-download" onclick="criarTemplateExcel()">
                📥 Baixar Template Excel
            </button>
            <p style="margin-top: 15px; color: #666;">
                O arquivo será gerado automaticamente com todas as formatações necessárias
            </p>
        </div>

        <div style="text-align: center;">
            <a href="dashboard-inscricoes.html" class="btn-voltar">
                ← Voltar para o Dashboard
            </a>
        </div>
    </div>

    <script>
        function criarTemplateExcel() {
            const dataAtual = new Date().toLocaleDateString('pt-BR');
            const BOM = '\uFEFF'; // Para suporte a caracteres especiais

            const templateContent = BOM + `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" 
                      xmlns:x="urn:schemas-microsoft-com:office:excel">
                <head>
                    <meta charset="UTF-8">
                    <style>
                        .header { 
                            background: #00CFFD; 
                            color: white; 
                            font-weight: bold; 
                            text-align: center; 
                        }
                        .title { 
                            background: #f8f9fa; 
                            font-weight: bold; 
                            text-align: center; 
                        }
                        td { mso-number-format: "@"; }
                    </style>
                </head>
                <body>
                    <table border="1">
                        <tr>
                            <td colspan="13" class="header">1º AUTISMO RUN - RELATÓRIO DE INSCRIÇÕES</td>
                        </tr>
                        <tr>
                            <td colspan="13" class="title">Data do Relatório: ${dataAtual}</td>
                        </tr>
                        <tr>
                            <td class="header">👤 NOME</td>
                            <td class="header">🎯 MODALIDADE</td>
                            <td class="header">📋 CATEGORIA</td>
                            <td class="header">📅 IDADE</td>
                            <td class="header">💰 STATUS</td>
                            <td class="header">💵 VALOR</td>
                            <td class="header">📆 DATA PGTO</td>
                            <td class="header">💳 MÉTODO</td>
                            <td class="header">👥 EQUIPE/PARCEIRO</td>
                            <td class="header">📱 TELEFONE</td>
                            <td class="header">📧 EMAIL</td>
                            <td class="header">📅 DATA</td>
                            <td class="header">⏰ HORÁRIO</td>
                        </tr>
                    </table>
                </body>
                </html>`;

            // Criar e baixar o arquivo
            const blob = new Blob([templateContent], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `template_1_autismo_run_${dataAtual.replace(/\//g, '-')}.xls`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            // Feedback visual
            const btn = document.querySelector('.btn-download');
            btn.innerHTML = '✅ Template Baixado!';
            setTimeout(() => {
                btn.innerHTML = '📥 Baixar Template Excel';
            }, 2000);
        }
    </script>
</body>
</html>
